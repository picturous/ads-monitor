name: Release Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    container:
      image: rust:1-bookworm
    env:
      CARGO_TARGET_DIR: /tmp/ads-monitor-target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting, clippy, and tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Fix workspace ownership for host runner
        if: always()
        run: chown -R 1000:1000 "${GITHUB_WORKSPACE}" || true

  docker:
    name: Build & Push Docker Image (GHCR)
    needs: verify
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ads-monitor-${{ runner.name }}
          keep-state: true
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "5GB"
              maxUsedSpace = "20GB"
              minFreeSpace = "10GB"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test built image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --demo --json > smoke.json
          head -n 20 smoke.json
          rm -f smoke.json

  deploy:
    name: Deploy to Portainer (GitOps)
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: bossoq/homelab-portainer-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Bump pinned image tag and push
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          sed -i -E "s#(ghcr\.io/picturous/ads-monitor):[^\"[:space:]]+#\1:${TAG}#g" ads-monitor/docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No tag change"
          else
            git commit -am "ads-monitor: deploy ${TAG}"
            git push
          fi

      - name: Trigger Portainer redeploy (via Cloudflare Access)
        run: |
          sleep 5
          # Use DoH (1.1.1.1) so NK runner bypasses local split-horizon DNS (10.0.1.1 -> NK Portainer)
          # and reaches QP Portainer via Cloudflare Access.
          curl --doh-url https://1.1.1.1/dns-query -fsS -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            "https://portainer.picturo.us/api/stacks/webhooks/01126559-d032-4b77-bd14-06693d8001ab"

  github-release:
    name: Publish GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          NOTES=$(cat <<EOF
          ### Docker Image
          \`\`\`bash
          docker pull ${IMAGE}
          docker run -p 8000:8000 --env-file .env ${IMAGE}
          \`\`\`

          - **Digest:** \`${{ needs.docker.outputs.digest }}\`
          EOF
          )
          gh release create "$TAG" \
            --generate-notes \
            --title "ads-monitor ${TAG}" \
            --notes "$NOTES"
