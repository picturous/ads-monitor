name: Release Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting, clippy, and tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  docker:
    name: Build & Push Docker Image (GHCR)
    needs: verify
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ads-monitor-${{ runner.name }}
          keep-state: true
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "5GB"
              maxUsedSpace = "20GB"
              minFreeSpace = "10GB"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test built image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --demo --json > smoke.json
          head -n 20 smoke.json
          rm -f smoke.json

  github-release:
    name: Publish GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          NOTES=$(cat <<EOF
          ### Docker Image
          \`\`\`bash
          docker pull ${IMAGE}
          docker run -p 8000:8000 --env-file .env ${IMAGE}
          \`\`\`

          - **Digest:** \`${{ needs.docker.outputs.digest }}\`
          EOF
          )
          gh release create "$TAG" \
            --generate-notes \
            --title "ads-monitor ${TAG}" \
            --notes "$NOTES"
