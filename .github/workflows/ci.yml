name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, Clippy, Test & Release Build (Self-Hosted)
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Rust toolchain components
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup component add rustfmt clippy
          fi
          rustc --version
          cargo --version

      - name: Check formatting
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked -- --nocapture

      - name: Build release binary
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --locked

      - name: Smoke test demo mode
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo run --release --locked -- --demo --no-open --out smoke-dashboard.html
          rm -f smoke-dashboard.html
