name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, Clippy, Test & Release Build (Proxmox Docker)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux","x64","proxmox","nk"]') }}
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure rustfmt & clippy
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked -- --nocapture

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test demo mode
        run: |
          cargo run --release --locked -- --demo --no-open --out smoke-dashboard.html
          rm -f smoke-dashboard.html
